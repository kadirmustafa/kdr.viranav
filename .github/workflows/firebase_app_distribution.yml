name: ViraNav CI/CD - Build & Firebase App Distribution

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build APK, AAB and Distribute
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Prepare Environment Configuration (.env)
        run: |
          if [ -f .env ]; then
            echo ".env exists"
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "CLOUDFLARE_WORKER_URL=https://marine-api.viranav.workers.dev" > .env
          fi

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Analyze Code
        run: flutter analyze

      - name: 7. Run Unit & Widget Tests
        run: flutter test

      - name: 7.5. Decode Android Release Keystore
        run: |
          echo "" | base64 --decode > android/app/upload-keystore.jks

      - name: 8. Build Signed Release APK & Google Play AAB
        env:
          KEYSTORE_PASSWORD: viranav2026password
        run: |
          flutter build apk --release --build-name=1.0.0 --build-number=${{ github.run_number }}
          flutter build appbundle --release --build-name=1.0.0 --build-number=${{ github.run_number }}

      - name: 9. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viranav-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 9.5. Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viranav-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

      - name: 10. Distribute to Firebase App Distribution
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_SERVICE_CREDENTIALS: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
        run: |
          if [ -n "$FIREBASE_APP_ID" ] && { [ -n "$FIREBASE_TOKEN" ] || [ -n "$FIREBASE_SERVICE_CREDENTIALS" ]; }; then
            echo "Deploying release APK to Firebase App Distribution for kadirmo@gmail.com..."
            if [ -n "$FIREBASE_SERVICE_CREDENTIALS" ]; then
              echo "$FIREBASE_SERVICE_CREDENTIALS" > sa_key.json
              export GOOGLE_APPLICATION_CREDENTIALS=sa_key.json
              npx --yes firebase-tools appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
                --app "$FIREBASE_APP_ID" \
                --testers "kadirmo@gmail.com" \
                --release-notes "ViraNav Seyir, Hava ve Logbook - Build #${{ github.run_number }}"
            else
              npx --yes firebase-tools appdistribution:distribute build/app/outputs/flutter-apk/app-release.apk \
                --app "$FIREBASE_APP_ID" \
                --testers "kadirmo@gmail.com" \
                --release-notes "ViraNav Seyir, Hava ve Logbook - Build #${{ github.run_number }}" \
                --token "$FIREBASE_TOKEN"
            fi
          else
            echo "::notice ::FIREBASE_APP_ID ve FIREBASE_TOKEN/FIREBASE_SERVICE_CREDENTIALS secret'ları henüz GitHub'a eklenmedi. APK başarıyla derlendi ve GitHub Artifacts'a yüklendi."
          fi
