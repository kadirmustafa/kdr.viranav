name: ViraNav CI/CD - Build & Firebase App Distribution

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-distribute:
    name: Build APK and Distribute to Firebase Testers
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 3. Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 4. Prepare Environment Configuration (.env)
        run: |
          if [ -f .env ]; then
            echo ".env exists"
          elif [ -f .env.example ]; then
            cp .env.example .env
          else
            echo "CLOUDFLARE_WORKER_URL=https://marine-api.viranav.workers.dev" > .env
          fi

      - name: 5. Install Dependencies
        run: flutter pub get

      - name: 6. Analyze Code
        run: flutter analyze

      - name: 7. Run Unit & Widget Tests
        run: flutter test

      - name: 8. Build Release APK
        run: flutter build apk --release

      - name: 9. Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: viranav-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      - name: 10. Distribute to Firebase App Distribution
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_CREDENTIALS }}
          testers: "kadirmo@gmail.com"
          releaseNotes: "ViraNav Denizcilik Seyir, Hava ve Logbook Mobil Uygulaması - Test Dağıtımı"
          file: build/app/outputs/flutter-apk/app-release.apk
